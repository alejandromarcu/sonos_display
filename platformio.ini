; Each [env:...] at the bottom is one hardware configuration: a board, a display and an IR remote,
; combined from the sections above it. Build one with `pio run -e <name>`; a bare `pio run` builds
; `default_envs`. To try new hardware, add a section for it and an env that uses it.

[platformio]
default_envs = freenove_s3_ssd1306

[env]
platform = espressif32@8.0.0
framework = arduino
monitor_speed = 115200
build_flags = ${this.custom_board_flags} ${this.custom_display_flags} ${this.custom_remote_flags}
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  ${this.custom_display_libs}
  ${this.custom_remote_libs}
; Filled in by the sections each env extends; these defaults stop the build if one is missing.
custom_board_flags =
custom_display_flags = -DNO_DISPLAY_SELECTED
custom_display_libs =
custom_remote_flags = -DNO_REMOTE_SELECTED
custom_remote_libs =

; ---- Boards: PlatformIO board settings and the GPIOs wired on it ---------------------------
; PIN_I2C_SDA, PIN_I2C_SCL: I2C displays. PIN_IR_RECEIVER: IR receiver data pin.

[board_freenove_s3]
; Freenove ESP32-S3-WROOM-1 N8R8 (8 MB quad flash, 8 MB octal PSRAM)
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
custom_board_flags = -DBOARD_HAS_PSRAM -DPIN_I2C_SDA=8 -DPIN_I2C_SCL=9 -DPIN_IR_RECEIVER=14

[board_atoms3_lite]
; M5Stack AtomS3 Lite (ESP32-S3FN8, 8 MB flash, no PSRAM) with the M5Stack IR Unit on its Grove port.
; The unit's receiver is the white wire (G1); its emitter (yellow, G2) isn't used. Serial goes over
; the native USB port, hence USB_CDC_ON_BOOT.
board = m5stack-atoms3
custom_board_flags = -DARDUINO_USB_CDC_ON_BOOT=1 -DPIN_IR_RECEIVER=1

; ---- Displays: drivers in src/displays/, each enabled by its DISPLAY_* flag ------------------

[display_ssd1306]
; 128x64 SSD1306 I2C OLED
custom_display_flags = -DDISPLAY_SSD1306_128X64
custom_display_libs = olikraus/U8g2@^2.35.30

[display_none]
; No screen; what's playing and command feedback still go to the serial monitor
custom_display_flags = -DDISPLAY_NONE
custom_display_libs =

; ---- IR remotes: button tables in src/remotes/ ---------------------------------------------

[remote_default]
; The cheap NEC remote this project started with
custom_remote_flags = '-DIR_REMOTE_CODES="remotes/default.h"'
custom_remote_libs = z3t0/IRremote@^4.4.1

[remote_none]
custom_remote_flags =
custom_remote_libs =

; ---- Configurations ------------------------------------------------------------------------

[env:freenove_s3_ssd1306]
extends = board_freenove_s3, display_ssd1306, remote_default

[env:freenove_s3_headless]
extends = board_freenove_s3, display_none, remote_default

[env:atoms3_lite_headless]
extends = board_atoms3_lite, display_none, remote_default
